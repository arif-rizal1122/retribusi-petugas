name: Deploy Petugas to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🚀 Build & Deploy Petugas to Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://api.sipanda.online

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/sipanda/retribusi-petugas-staging
            git fetch origin && git reset --hard origin/main
            npm ci && npm run build
            sudo systemctl reload nginx
            echo "✅ Petugas Staging deployed!"

      - name: Health Check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://petugas.sipanda.online)
          echo "Petugas Staging: HTTP $STATUS"
