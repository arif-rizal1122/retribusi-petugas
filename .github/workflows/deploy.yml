name: Deploy Petugas to VPS

on:
  push:
    branches:
      - main
      - dev 

jobs:
  deploy:
    name: Build and Deploy Petugas on VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # 1. Tentukan target folder berdasarkan branch
            if [ "${{ github.ref_name }}" == "main" ]; then
              TARGET_DIR="/home/sipanda/retribusi-petugas"
              API_URL="https://apimpad.baubaukota.go.id"
            else
              TARGET_DIR="/home/sipanda/retribusi-petugas-staging"
              API_URL="https://api.sipanda.online"
            fi

            echo "🚀 Starting server-side build for Petugas in $TARGET_DIR..."
            # 2. Hapus repository lama untuk Clean Build
            echo "🗑️ Deleting old repository directory..."
            rm -rf "$TARGET_DIR"
            
            echo "📦 Cloning fresh repository..."
            git clone https://github.com/muhdanfyan/retribusi-petugas.git "$TARGET_DIR"

            cd "$TARGET_DIR"
            
            # 3. Checkout branch
            echo "📥 Fetching and checking out ${{ github.ref_name }}..."
            git checkout ${{ github.ref_name }}

            # 4. Install dependencies and Build
            echo "🛠️ Installing dependencies..."
            npm install --no-fund --no-audit

            echo "🏗️ Building application with API_URL=$API_URL..."
            export VITE_API_URL="$API_URL"
            npm run build

            # 🌐 DEEP NETWORKING FORENSIC
            echo "--- NETWORKING AUDIT ---" > networking_audit.txt
            echo "1. Public IP (as seen by outside): $(curl -s ifconfig.me || echo 'Failed')" >> networking_audit.txt
            echo "2. Local IPs: $(hostname -I)" >> networking_audit.txt
            echo "3. DNS Lookup for petugasmpad: $(nslookup petugasmpad.baubaukota.go.id | grep 'Address' | tail -n 1 || echo 'Failed')" >> networking_audit.txt
            echo "4. Nginx Active Config for Petugas:" >> networking_audit.txt
            grep -r "petugasmpad" /etc/nginx/ 2>/dev/null >> networking_audit.txt || echo "No nginx match" >> networking_audit.txt
            
            # Identify active root from config
            REAL_ROOT=$(grep -r "root" /etc/nginx/ | grep "petugasmpad" | awk '{print $NF}' | tr -d ';' | head -n 1)
            echo "5. Identified REAL_ROOT: $REAL_ROOT" >> networking_audit.txt

            if [ -n "$REAL_ROOT" ]; then
              echo "🎯 ACTIVE ROOT FOUND: $REAL_ROOT. Forcing sync..."
              mkdir -p "$REAL_ROOT"
              echo "🗑️ Clearing active webroot..."
              rm -rf "$REAL_ROOT"/*
              cp -r dist/* "$REAL_ROOT"/
              echo "Build ID: ${{ github.run_id }}" > "$REAL_ROOT/deploy_verify.txt"
              cp networking_audit.txt "$REAL_ROOT"/
            fi
            
            echo "✅ Forensic Networking Audit and Clean Deploy Completed!"
