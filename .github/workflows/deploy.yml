name: Deploy Petugas to VPS

on:
  push:
    branches:
      - main
      - dev 

jobs:
  deploy:
    name: Build and Deploy Petugas on VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # 1. Tentukan target folder berdasarkan branch
            if [ "${{ github.ref_name }}" == "main" ]; then
              TARGET_DIR="/home/sipanda/retribusi-petugas"
              API_URL="https://api.mpad.online"
            else
              TARGET_DIR="/home/sipanda/retribusi-petugas-staging"
              API_URL="https://api.mpad.online"
            fi

            echo "🚀 Starting server-side build for Petugas in $TARGET_DIR..."
            
            # 2. Masuk ke folder atau clone jika belum ada
            if [ ! -d "$TARGET_DIR" ]; then
              echo "📦 Cloning repository..."
              git clone https://github.com/muhdanfyan/retribusi-petugas.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            
            # 3. Pull latest code
            echo "📥 Fetching latest code..."
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            # 4. Install dependencies and Build
            echo "🛠️ Installing dependencies..."
            npm install --no-fund --no-audit

            echo "🏗️ Building application with API_URL=$API_URL..."
            export VITE_API_URL="$API_URL"
            npm run build

            # 5. Temukan webroot aktif (Forensic Root detection)
            # site saat ini menggunakan index-C3aX-mhe.js
            WEBROOT=$(grep -r "petugasmpad" /etc/nginx/ 2>/dev/null | grep "root" | awk '{print $NF}' | tr -d ';' | head -n 1)
            
            if [ -n "$WEBROOT" ]; then
              echo "🎯 Active webroot detected: $WEBROOT"
              # Bersihkan dan pindahkan hasil build
              rm -rf "$WEBROOT"/*
              cp -r dist/* "$WEBROOT"/
              echo "✅ Build success and deployed to $WEBROOT"
            else
              echo "⚠️ Could not find active webroot for petugasmpad. Files remain in $TARGET_DIR/dist"
            fi

            echo "Build ID: ${{ github.run_id }}" > "$TARGET_DIR/dist/deploy_status.txt"
            echo "✅ Petugas Deploy Completed Successfully!"
