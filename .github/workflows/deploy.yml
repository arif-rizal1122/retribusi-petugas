name: Deploy Petugas to VPS

on:
  push:
    branches:
      - main
      - dev 

jobs:
  build-and-deploy:
    name: Build and Deploy Petugas App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Target Dir
        id: vars
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "target_dir=/home/sipanda/retribusi-petugas" >> $GITHUB_OUTPUT
            echo "api_url=https://api.sipanda.online" >> $GITHUB_OUTPUT
            echo "build_cmd=build" >> $GITHUB_OUTPUT
          else
            echo "target_dir=/home/sipanda/retribusi-petugas-dev" >> $GITHUB_OUTPUT
            echo "api_url=https://api-dev.sipanda.online" >> $GITHUB_OUTPUT
            echo "build_cmd=build:staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy and Build on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            TARGET_DIR=${{ steps.vars.outputs.target_dir }}
            API_URL=${{ steps.vars.outputs.api_url }}
            BUILD_CMD=${{ steps.vars.outputs.build_cmd }}
            BRANCH=${{ github.ref_name }}

            echo "🚀 Starting Deployment on VPS for $BRANCH..."
            
            # Ensure target directory exists and is a git repo
            if [ ! -d "$TARGET_DIR" ]; then
              echo "❌ Target directory $TARGET_DIR does not exist. Please check VPS setup."
              exit 1
            fi

            cd $TARGET_DIR
            
            # Pull latest code
            echo "📥 Pulling latest code from $BRANCH..."
            git pull origin $BRANCH

            # Install dependencies
            echo "📦 Installing npm dependencies..."
            npm install --no-audit --no-fund

            # Build application on VPS
            echo "🏗️ Building application with API_URL=$API_URL..."
            rm -rf dist
            VITE_API_URL=$API_URL npm run $BUILD_CMD

            # Comprehensive VPS Audit
            AUDIT_LOG="vps_audit.log"
            echo "--- MPAD VPS AUDIT ---" > $AUDIT_LOG
            echo "Timestamp: $(date)" >> $AUDIT_LOG
            echo "User: $(whoami) (ID: $(id))" >> $AUDIT_LOG
            echo "Current Dir: $(pwd)" >> $AUDIT_LOG
            echo "--- Directory Structure ---" >> $AUDIT_LOG
            ls -F >> $AUDIT_LOG
            echo "--- Dist Structure ---" >> $AUDIT_LOG
            ls -F dist/ 2>/dev/null || echo "Dist folder missing" >> $AUDIT_LOG
            echo "--- Assets Content (First 5) ---" >> $AUDIT_LOG
            ls -F dist/assets/ 2>/dev/null | head -n 5 >> $AUDIT_LOG
            echo "--- Env Status ---" >> $AUDIT_LOG
            [ -f .env ] && echo ".env exists" || echo ".env MISSING" >> $AUDIT_LOG
            echo "--- Git Status ---" >> $AUDIT_LOG
            git branch >> $AUDIT_LOG
            
            echo "✅ Audit completed. Log: $AUDIT_LOG"
