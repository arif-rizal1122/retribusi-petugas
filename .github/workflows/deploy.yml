name: Deploy Petugas to VPS

on:
  push:
    branches:
      - main
      - dev 

jobs:
  build-and-deploy:
    name: Build and Deploy Petugas App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Target Dir
        id: vars
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "target_dir=/home/sipanda/retribusi-petugas" >> $GITHUB_OUTPUT
            echo "api_url=https://api.mpad.online" >> $GITHUB_OUTPUT
            echo "build_cmd=build" >> $GITHUB_OUTPUT
          else
            echo "target_dir=/home/sipanda/retribusi-petugas-staging" >> $GITHUB_OUTPUT
            echo "api_url=https://api.mpad.online" >> $GITHUB_OUTPUT
            echo "build_cmd=build:staging" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: |
          npm run ${{ steps.vars.outputs.build_cmd }}
          # Injek Build ID ke index.html untuk verifikasi (no_screenshot)
          sed -i "s/<\/head>/<meta name='x-build-id' content='${{ github.run_id }}'><!-- Build: ${{ github.run_id }} --><\/head>/" dist/index.html
        env:
          VITE_API_URL: ${{ steps.vars.outputs.api_url }}

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*"
          target: ${{ steps.vars.outputs.target_dir }}
          strip_components: 1

      - name: Finalize Webroot (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            TARGET_DIR=${{ steps.vars.outputs.target_dir }}
            echo "🚀 Finalizing Petugas deployment..."
            echo "📡 Remote IP: $(curl -s ifconfig.me || hostname -I)"

            # 🎯 FORENSIC MISSION: Global Nginx and Path Search
            # 1. Search for the domain in ALL nginx configs
            ACTIVE_ROOT=$(grep -r "petugasmpad" /etc/nginx/ 2>/dev/null | grep "root" | awk '{print $NF}' | tr -d ';' | head -n 1)
            
            # 2. If not found, search the whole disk for the broken asset hash
            if [ -z "$ACTIVE_ROOT" ]; then
                echo "⚠️ Domain not found in nginx configs. Searching filesystem for index-C3aX-mhe.js..."
                ACTIVE_ROOT=$(find /var/www /home/sipanda /var/html -name "index-C3aX-mhe.js" -exec dirname {} \; -exec dirname {} \; 2>/dev/null | head -n 1)
            fi

            if [ -n "$ACTIVE_ROOT" ]; then
              echo "🎯 SUCCESS: Active webroot identified at $ACTIVE_ROOT"
              cp -r "$TARGET_DIR"/* "$ACTIVE_ROOT"/
              TARGET_DIR=$ACTIVE_ROOT
            else
              echo "❌ FAILURE: Active webroot not found. Staying in $TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            
            # Build ID Audit
            echo "Build: ${{ github.run_id }}" > deploy_verify.txt
            echo "Real Path: $(pwd)" >> deploy_verify.txt

            # Asset normalization
            [ -d "dist" ] && cp -r dist/* . && rm -rf dist
            
            echo "✅ Petugas Deploy to ${{ github.ref_name }} completed in $(pwd)!"
