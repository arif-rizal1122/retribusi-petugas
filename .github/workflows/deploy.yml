name: Deploy Petugas to VPS

on:
  push:
    branches:
      - main
      - dev 

jobs:
  build-and-deploy:
    name: Build and Deploy Petugas App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Target Dir
        id: vars
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "target_dir=/home/sipanda/retribusi-petugas" >> $GITHUB_OUTPUT
            echo "api_url=https://api.mpad.online" >> $GITHUB_OUTPUT
            echo "build_cmd=build" >> $GITHUB_OUTPUT
          else
            echo "target_dir=/home/sipanda/retribusi-petugas-staging" >> $GITHUB_OUTPUT
            echo "api_url=https://api.mpad.online" >> $GITHUB_OUTPUT
            echo "build_cmd=build:staging" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: |
          npm run ${{ steps.vars.outputs.build_cmd }}
          # Injek Build ID ke index.html untuk verifikasi (no_screenshot)
          sed -i "s/<\/head>/<meta name='x-build-id' content='${{ github.run_id }}'><!-- Build: ${{ github.run_id }} --><\/head>/" dist/index.html
        env:
          VITE_API_URL: ${{ steps.vars.outputs.api_url }}

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*"
          target: ${{ steps.vars.outputs.target_dir }}
          strip_components: 1

      - name: Finalize Webroot (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            TARGET_DIR=${{ steps.vars.outputs.target_dir }}
            echo "🚀 Finalizing Petugas deployment..."

            # 🎯 FORENSIC: Temukan webroot aktif dengan mencari aset yang sudah ada
            # Site saat ini menggunakan assets/index-C3aX-mhe.js (yang kita tahu "broken")
            REAL_ROOT=$(find /home/sipanda /var/www -name "index-C3aX-mhe.js" -exec dirname {} \; -exec dirname {} \; 2>/dev/null | head -n 1)
            
            if [ -n "$REAL_ROOT" ]; then
              echo "🎯 Detected active webroot: $REAL_ROOT"
              # Sinkronisasi file dari target_dir ke REAL_ROOT
              cp -r $TARGET_DIR/* $REAL_ROOT/
              echo "✅ Files synchronized to active webroot: $REAL_ROOT"
              TARGET_DIR=$REAL_ROOT
            else
              echo "ℹ️ Active webroot with index-C3aX-mhe.js not found. Using default."
            fi

            echo "🚀 Finalizing Petugas deployment in $TARGET_DIR..."
            cd $TARGET_DIR
            
            # Additional cleanup/audit
            {
              echo "--- DEPLOY TIME: $(date) ---"
              echo "--- TARGET ROOT: $TARGET_DIR ---"
              ls -la index.html
            } > forensic_audit_v3.txt

            # Ensure assets are properly placed if nested
            [ -d "dist" ] && cp -r dist/* . && rm -rf dist
            
            echo "✅ Petugas Deploy to ${{ github.ref_name }} completed successfully!"
