name: Deploy Petugas to VPS

on:
  push:
    branches:
      - main
      - dev 

jobs:
  build-and-deploy:
    name: Build and Deploy Petugas App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Target Dir
        id: vars
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "target_dir=/home/sipanda/retribusi-petugas" >> $GITHUB_OUTPUT
            echo "api_url=https://api.mpad.online" >> $GITHUB_OUTPUT
            echo "build_cmd=build" >> $GITHUB_OUTPUT
          else
            echo "target_dir=/home/sipanda/retribusi-petugas-staging" >> $GITHUB_OUTPUT
            echo "api_url=https://api.mpad.online" >> $GITHUB_OUTPUT
            echo "build_cmd=build:staging" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: |
          npm run ${{ steps.vars.outputs.build_cmd }}
          # Injek Build ID ke index.html untuk verifikasi (no_screenshot)
          sed -i "s/<\/head>/<meta name='x-build-id' content='${{ github.run_id }}'><!-- Build: ${{ github.run_id }} --><\/head>/" dist/index.html
        env:
          VITE_API_URL: ${{ steps.vars.outputs.api_url }}

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*"
          target: ${{ steps.vars.outputs.target_dir }}
          strip_components: 1

      - name: Finalize Webroot (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            TARGET_DIR=${{ steps.vars.outputs.target_dir }}
            echo "🚀 Finalizing Petugas deployment..."

            # 🎯 FORENSIC MISSION: Catch Nginx Configs
            echo "--- NGINX CONFIGS ---" > forensic_audit_final.txt
            cat /etc/nginx/sites-enabled/* >> forensic_audit_final.txt 2>/dev/null || echo "Could not read nginx configs" >> forensic_audit_final.txt
            
            # Find root for petugasmpad
            ACTIVE_ROOT=$(grep -r "root" /etc/nginx/sites-enabled/ | grep "petugasmpad" | awk '{print $2}' | tr -d ';' | head -n 1)
            
            if [ -n "$ACTIVE_ROOT" ]; then
              echo "🎯 ACTIVE ROOT FOUND: $ACTIVE_ROOT"
              cp -r "$TARGET_DIR"/* "$ACTIVE_ROOT"/
              TARGET_DIR=$ACTIVE_ROOT
            fi

            cd "$TARGET_DIR"
            # Post-deploy checks
            {
              echo "--- LOG DEPLOY: $(date) ---"
              echo "--- TARGET: $TARGET_DIR ---"
            } >> forensic_audit_final.txt

            # Asset normalization
            [ -d "dist" ] && cp -r dist/* . && rm -rf dist
            
            echo "✅ Petugas Deploy to ${{ github.ref_name }} completed!"
