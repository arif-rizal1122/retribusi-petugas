name: Deploy Petugas to VPS

on:
  push:
    branches:
      - main
      - dev 

jobs:
  build-and-deploy:
    name: Build and Deploy Petugas App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Target Dir
        id: vars
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "target_dir=/home/sipanda/retribusi-petugas" >> $GITHUB_OUTPUT
            echo "api_url=https://api.mpad.online" >> $GITHUB_OUTPUT
            echo "build_cmd=build" >> $GITHUB_OUTPUT
          else
            echo "target_dir=/home/sipanda/retribusi-petugas-staging" >> $GITHUB_OUTPUT
            echo "api_url=https://api.mpad.online" >> $GITHUB_OUTPUT
            echo "build_cmd=build:staging" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: |
          npm run ${{ steps.vars.outputs.build_cmd }}
          # Injek Build ID ke index.html untuk verifikasi (no_screenshot)
          sed -i "s/<\/head>/<meta name='x-build-id' content='${{ github.run_id }}'><!-- Build: ${{ github.run_id }} --><\/head>/" dist/index.html
        env:
          VITE_API_URL: ${{ steps.vars.outputs.api_url }}

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*"
          target: ${{ steps.vars.outputs.target_dir }}
          strip_components: 1

      - name: Finalize Webroot (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            TARGET_DIR=${{ steps.vars.outputs.target_dir }}
            echo "🔎 Starting forensic diagnosis..."

            # 📡 1. Check Remote IP
            REMOTE_IP=$(curl -s ifconfig.me || hostname -I | awk '{print $1}')
            echo "📡 Remote Public IP: $REMOTE_IP"

            # 📂 2. Search for the domain in all of /etc/nginx
            echo "📂 Searching for petugasmpad in Nginx configs..."
            REAL_ROOT=$(grep -r "root" /etc/nginx/ | grep "petugasmpad" | awk '{print $NF}' | tr -d ';' | head -n 1)
            
            # 📜 3. Create diagnostic file in both default and potentially discovered root
            {
              echo "--- PETUGAS DIAGNOSTIC ---"
              echo "Deploy Time: $(date)"
              echo "Remote IP: $REMOTE_IP"
              echo "Target Dir: $TARGET_DIR"
              echo "Discovered Webroot: $REAL_ROOT"
              echo "Expected Public IP: 157.10.252.74"
            } > deploy_diagnostic.txt
            
            if [ -n "$REAL_ROOT" ] && [ "$REAL_ROOT" != "$TARGET_DIR" ]; then
                echo "🎯 Match! Active webroot detected at: $REAL_ROOT"
                mkdir -p "$REAL_ROOT"
                cp -r $TARGET_DIR/* "$REAL_ROOT"/
                cp deploy_diagnostic.txt "$REAL_ROOT"/
                TARGET_DIR=$REAL_ROOT
            fi

            cd "$TARGET_DIR"
            # Asset normalization
            [ -d "dist" ] && cp -r dist/* . && rm -rf dist
            
            echo "✅ Diagnostic deployment complete in $(pwd)"
